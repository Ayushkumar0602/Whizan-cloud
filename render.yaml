# render.yaml — Render Blueprint for Whizan API + Dashboard
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy to Render by connecting this repo and pointing to this file.

services:
  # ─── API (Fastify) ──────────────────────────────────────────────────────────
  - type: web
    name: whizan-api
    runtime: node
    rootDir: apps/api
    buildCommand: bash ../../scripts/render-build.sh || bash scripts/render-build.sh
    startCommand: node dist/index.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000" # Render assigns port 10000 internally
      - key: DATABASE_URL
        sync: false # Fill in manually via Render dashboard
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false # Must be exactly 64 hex chars — fill manually
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false # e.g. https://api.whizan.cloud/api/auth/github/callback
      - key: GITHUB_TOKEN
        sync: false
      - key: DASHBOARD_URL
        sync: false # e.g. https://dashboard.whizan.cloud
      - key: BASE_DOMAIN
        sync: false # e.g. whizan.cloud
      - key: INTERNAL_SECRET
        sync: false
      - key: INTERNAL_MESH_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY_4
        sync: false
      - key: GEMINI_API_KEY_5
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: "whizan-deployments"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AZURE_VM_WAKE_WEBHOOK_URL
        sync: false
      - key: AZURE_VM_SLEEP_WEBHOOK_URL
        sync: false

# NOTE: Dashboard is deployed on Vercel (not Render).
# See: https://vercel.com — connect repo, set Root Directory = apps/dashboard
